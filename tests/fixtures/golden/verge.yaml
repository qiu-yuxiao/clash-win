# Clash Verge Config

config_version: 3
app_log_level: null
app_log_max_size: 128
app_log_max_count: 40
language: en
theme_mode: dark
env_type: powershell
start_page: /
startup_script: null
traffic_graph: true
enable_memory_usage: true
enable_group_icon: true
pause_render_traffic_stats_on_blur: true
menu_icon: monochrome
notice_position: top-right
collapse_navbar: false
enable_tun_mode: true
enable_auto_launch: true
enable_silent_start: true
enable_system_proxy: false
enable_proxy_guard: true
enable_bypass_check: true
use_default_bypass: true
system_proxy_bypass: null
proxy_guard_duration: 30
proxy_auto_config: false
pac_file_content: |
  function FindProxyForURL(url, host) {
    return "PROXY 127.0.0.1:%mixed-port%; SOCKS5 127.0.0.1:%mixed-port%; DIRECT;";
  }
proxy_host: 127.0.0.1
theme_setting: null
web_ui_list: null
clash_core: mini-mihomo
enable_always_on_top: false
home_cards: null
auto_close_connection: false
auto_check_update: false
default_latency_test: null
enable_auto_delay_detection: null
auto_delay_detection_interval_minutes: null
enable_builtin_enhanced: true
proxy_layout_column: null
test_list: null
auto_log_clean: 2
verge_mixed_port: 10805
verge_socks_port: 10812
verge_socks_enabled: false
verge_port: 10813
verge_http_enabled: false
enable_auto_light_weight_mode: true
auto_light_weight_minutes: 5
enable_hover_jump_navigator: true
hover_jump_navigator_delay: 280
enable_external_controller: false
rule_fallback: direct
