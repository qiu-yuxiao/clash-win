proxy-groups:
  - name: 套餐详情
    type: select
    include-all: true
    filter: "网址|剩余流量|过期时间|套餐|购买|有效|回家页|官网|订阅|到期"
  - name: 主代理
    type: select
    proxies:
      - 自动选择
      - 负载均衡
      - us自动切换
      - jp自动切换
      - DIRECT
    include-all: true
    exclude-filter: "网址|剩余流量|过期时间|套餐|购买|有效"
  - name: 自动选择
    type: url-test
    include-all: true
    exclude-filter: "网址|剩余流量|过期时间|套餐|购买|有效"
    url: 'http://www.gstatic.com/generate_204'
    interval: 180
    tolerance: 25
  - name: 负载均衡
    type: load-balance
    include-all: true
    exclude-filter: "网址|剩余流量|过期时间|套餐|购买|有效"
    strategy: consistent-hashing
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
  - name: us自动切换
    type: fallback
    include-all: true
    filter: "美国"
    url: 'http://www.gstatic.com/generate_204'
    interval: 60
  - name: jp自动切换
    type: fallback
    include-all: true
    filter: "日本"
    url: 'http://www.gstatic.com/generate_204'
    interval: 60
  - name: 国内直连
    type: select
    proxies:
      - DIRECT
      - 主代理

rule-providers:
  Local-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Local/Local-IP.mrs'
    path: ./ruleset/Local-IP.mrs
    proxy: DIRECT
    interval: 86400
  China-Site:
    type: http
    behavior: domain
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/China/China-Site.mrs'
    path: ./ruleset/China-Site.mrs
    proxy: DIRECT
    interval: 86400
  China-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/China/China-IP.mrs'
    path: ./ruleset/China-IP.mrs
    proxy: DIRECT
    interval: 86400

rules:
  - 'RULE-SET,Local-IP,国内直连,no-resolve'
  - 'RULE-SET,China-Site,国内直连'
  - 'RULE-SET,China-IP,国内直连'
  - 'MATCH,主代理'
