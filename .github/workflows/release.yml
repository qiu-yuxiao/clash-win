# Clash Win — Deterministic Release Pipeline (validate -> build -> publish)
#
# 设计原则：
#   1) 单一事实源：版本号以 constants.h (kAppVersion) 为锚，同步校验 clashwin.rc 与 clashwin.nsi；
#      发布说明以 CHANGELOG.md 的 `## v<VERSION>` 章节为唯一事实源，常青说明统一指向 docs/KNOWN_LIMITATIONS.md。
#   2) 本地与 CI 同构：预检调用同一个 scripts/release_preflight.ps1，回归测试调用同一个 scripts/run_tests.ps1。
#   3) 零窗口期断档与零分支分叉：发版前不清空 updater/app-update.json；publish 阶段在 Release 资产就绪后
#      生成带 minisign 签名的 app-update.json，既上传为 Release 资产，又回写 main 并尝试快进同步 dev。

name: Release Build (Clash Win)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.7)'
        required: true

permissions:
  contents: write

concurrency:
  group: '${{ github.workflow }} - ${{ github.ref }}'
  cancel-in-progress: false

env:
  PRODUCT_NAME: 'Clash Win'
  REPO: 'qiu-yuxiao/clash-win'

jobs:
  # ========== 1. 极速静态门禁（Ubuntu ~20s，任何元数据/说明/编码问题立即拦截） ==========
  validate:
    name: Validate version, changelog & script encoding
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve & validate version consistency
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys

          ver = sys.argv[1]
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$", ver):
              sys.exit(f"::error::Invalid SemVer version: {ver}")

          base_ver = re.match(r"^([0-9]+\.[0-9]+\.[0-9]+)", ver).group(1)
          comma_ver = base_ver.replace(".", ",") + ",0"

          const_txt = pathlib.Path("include/clashwin/config/constants.h").read_text(encoding="utf-8")
          m_c = re.search(r'kAppVersion\s*=\s*"([^"]+)"', const_txt)
          if not m_c or m_c.group(1) != ver:
              sys.exit(f"::error::constants.h kAppVersion ({m_c.group(1) if m_c else 'missing'}) != {ver}")

          nsi_path = pathlib.Path("installer/clashwin.nsi")
          if not nsi_path.read_bytes().startswith(b"\xef\xbb\xbf"):
              sys.exit("::error::installer/clashwin.nsi missing UTF-8 BOM (required by makensis)")
          nsi_txt = nsi_path.read_text(encoding="utf-8-sig")
          m_n = re.search(r'!define\s+VERSION\s+"([^"]+)"', nsi_txt)
          if not m_n or m_n.group(1) != ver:
              sys.exit(f"::error::clashwin.nsi VERSION ({m_n.group(1) if m_n else 'missing'}) != {ver}")

          rc_txt = pathlib.Path("src/clashwin.rc").read_text(encoding="utf-8")
          for pat, expected, label in [
              (r"FILEVERSION\s+([0-9,]+)", comma_ver, "FILEVERSION"),
              (r"PRODUCTVERSION\s+([0-9,]+)", comma_ver, "PRODUCTVERSION"),
              (r'"FileVersion",\s*"([^"]+)"', ver, "FileVersion"),
              (r'"ProductVersion",\s*"([^"]+)"', ver, "ProductVersion"),
          ]:
              m = re.search(pat, rc_txt)
              if not m or m.group(1) != expected:
                  sys.exit(f"::error::src/clashwin.rc {label} ({m.group(1) if m else 'missing'}) != {expected}")

          if not pathlib.Path("docs/KNOWN_LIMITATIONS.md").is_file():
              sys.exit("::error::Missing docs/KNOWN_LIMITATIONS.md")

          cl = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sec = re.search(rf"(?ms)^##\s+v{re.escape(ver)}\b[^\r\n]*\r?\n(.*?)(?=^##\s+v|\Z)", cl)
          if not sec or len(sec.group(1).strip()) < 20:
              sys.exit(f"::error::CHANGELOG.md missing or empty '## v{ver}' section")
          if re.search(r"(?i)\b(TODO|TBD|FIXME)\b|待补充|请补充", sec.group(1)):
              sys.exit(f"::error::CHANGELOG.md '## v{ver}' still contains placeholder TODO/TBD")

          bad_bom, bad_cr = [], []
          for folder in ("scripts", "installer"):
              for p in pathlib.Path(folder).rglob("*.ps1"):
                  b = p.read_bytes()
                  if not b.startswith(b"\xef\xbb\xbf"):
                      bad_bom.append(str(p))
                  for i in range(len(b) - 1):
                      if b[i] == 0x0D and b[i + 1] != 0x0A:
                          bad_cr.append(str(p))
                          break
          if bad_bom:
              sys.exit(f"::error::PowerShell scripts missing UTF-8 BOM: {bad_bom}")
          if bad_cr:
              sys.exit(f"::error::PowerShell scripts contain lone CR: {bad_cr}")

          print(f"OK: version={ver}, constants.h/clashwin.rc/clashwin.nsi/CHANGELOG.md/BOM all verified.")
          PY

      - name: Pre-validate GitHub authentication
        run: gh auth status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== 2. Windows x64 构建 + 全量隔离回归 + 便携包 + NSIS 安装包 ==========
  build:
    name: Build Windows x64 (Setup + Portable)
    needs: [validate]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "makensis.exe not found after choco install nsis"
          }
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Restore sidecar kernels (5 upstream binaries)
        shell: pwsh
        env:
          SIDECAR_ARCHIVE_URL: ${{ vars.SIDECAR_ARCHIVE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIDECAR_ARCHIVE_URL)) {
            throw "未配置仓库变量 SIDECAR_ARCHIVE_URL，无法还原 sidecar 5 个上游二进制。"
          }
          New-Item -ItemType Directory -Force -Path sidecar | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'clashwin-sidecar.zip'
          Invoke-WebRequest -Uri $env:SIDECAR_ARCHIVE_URL -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath sidecar -Force
          Get-ChildItem sidecar -Filter *.exe | ForEach-Object {
            "restored: $($_.Name)  $($_.Length) bytes"
          }
          $ExpectedWinMihomoHash = '1CDE41CFFFD3DE0AEDAD63C0A8515E1CE5EEA507E8133AED0F637D316C93800A'
          $wm = Join-Path $Pwd.Path 'sidecar\win-mihomo.exe'
          if (-not (Test-Path -LiteralPath $wm)) {
            Write-Host "归档缺 win-mihomo.exe，从 MetaCubeX/mihomo v1.19.33 补齐..." -ForegroundColor Yellow
            $tag = 'v1.19.33'
            $mz = Join-Path $env:RUNNER_TEMP "mihomo-$tag.zip"
            $url = "https://github.com/MetaCubeX/mihomo/releases/download/$tag/mihomo-windows-amd64-$tag.zip"
            Invoke-WebRequest -Uri $url -OutFile $mz -UseBasicParsing
            $tmp = Join-Path $env:RUNNER_TEMP 'mihomo-extract'
            if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
            Expand-Archive -LiteralPath $mz -DestinationPath $tmp -Force
            $exe = Get-ChildItem $tmp -Filter *.exe | Select-Object -First 1
            if (-not $exe) { throw "mihomo 归档内未找到 exe" }
            Copy-Item -LiteralPath $exe.FullName -Destination $wm -Force
            $h = (Get-FileHash -LiteralPath $wm -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($h -ne $ExpectedWinMihomoHash) {
              throw "补齐的 win-mihomo.exe 哈希不匹配基线 ($h != $ExpectedWinMihomoHash)"
            }
            "fetched fallback win-mihomo.exe  $($exe.Length) bytes  sha256=$h"
          }

      - name: Run release preflight gates (GATE 1~7)
        shell: pwsh
        run: |
          & .\scripts\release_preflight.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "release_preflight 未通过，阻止发布" }

      - name: Configure (CMake / VS2026 x64)
        shell: pwsh
        run: cmake -B build -G "Visual Studio 18 2026" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Full regression (shared isolated runner)
        shell: pwsh
        run: |
          & .\scripts\run_tests.ps1 -RunDir 'build\cwtest' -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "全量回归测试未通过 (EXIT=$LASTEXITCODE)" }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          & .\scripts\portable.ps1 -Version $env:VERSION -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "portable.ps1 failed" }

      - name: Build NSIS setup.exe
        shell: pwsh
        run: |
          & .\installer\build_installer.ps1 -Version $env:VERSION -Configuration Release -SkipSign
          if ($LASTEXITCODE -ne 0) { throw "build_installer.ps1 failed" }

      - name: Verify release artifacts & write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip   = "dist\ClashWin_$($env:VERSION)_x64_portable.zip"
          $setup = "dist\ClashWin_$($env:VERSION)_x64-setup.exe"
          foreach ($f in @($zip, $setup)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing artifact: $f" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $z.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
          } finally { $z.Dispose() }
          foreach ($n in @('clashwin.exe', '.config/PORTABLE', 'sidecar/win-mihomo.exe', '用户必读.txt')) {
            if ($names -notcontains $n) { throw "portable.zip missing entry: $n" }
          }
          $zipSidecarEntries = @($names | Where-Object { $_ -like 'sidecar/*' -and -not $_.EndsWith('/') })
          if ($zipSidecarEntries.Count -ne 5) {
            throw "portable.zip sidecar/ contains unexpected files (count=$($zipSidecarEntries.Count)): $($zipSidecarEntries -join ', ')"
          }

          $buildExeSha = (Get-FileHash -LiteralPath 'build\bin\Release\clashwin.exe' -Algorithm SHA256).Hash
          $stageExeSha = (Get-FileHash -LiteralPath 'installer\stage\clashwin.exe' -Algorithm SHA256).Hash
          if ($buildExeSha -ne $stageExeSha) {
            throw "build clashwin.exe ($buildExeSha) != stage clashwin.exe ($stageExeSha)"
          }

          $wmStage = Join-Path $Pwd.Path 'installer\stage\sidecar\win-mihomo.exe'
          if (-not (Test-Path -LiteralPath $wmStage)) {
            throw "打包源缺失 win-mihomo.exe: $wmStage"
          }
          $wmBytes = (Get-Item -LiteralPath $wmStage).Length
          $wmHash  = (Get-FileHash -LiteralPath $wmStage -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($wmBytes -ne 61247488 -or $wmHash -ne '1CDE41CFFFD3DE0AEDAD63C0A8515E1CE5EEA507E8133AED0F637D316C93800A') {
            throw "打包源 win-mihomo.exe 大小或哈希异常 (bytes=$wmBytes, hash=$wmHash)"
          }
          if ((Get-Item -LiteralPath $setup).Length -lt 1MB) {
            throw "setup.exe 磁盘体积异常 (<1MB)"
          }

          $lines = foreach ($f in @($zip, $setup)) {
            $h = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File 'dist\SHA256SUMS.txt' -Encoding utf8
          Get-Content 'dist\SHA256SUMS.txt'

          $auth = Get-AuthenticodeSignature -LiteralPath $setup
          $subject = if ($auth.SignerCertificate) { $auth.SignerCertificate.Subject } else { '' }
          "$($auth.Status)|$subject" | Out-File 'dist\SIGNATURE_STATUS.txt' -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clashwin-${{ needs.validate.outputs.version }}-x64
          path: |
            dist/ClashWin_${{ needs.validate.outputs.version }}_x64_portable.zip
            dist/ClashWin_${{ needs.validate.outputs.version }}_x64-setup.exe
            dist/SHA256SUMS.txt
            dist/SIGNATURE_STATUS.txt
          if-no-files-found: error
          retention-days: 14

  # ========== 3. 发布 GitHub Release + 生成签名更新清单并双端同步 ==========
  publish:
    name: Publish Release & Update Manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: clashwin-${{ needs.validate.outputs.version }}-x64
          path: dist

      - name: Assemble release notes & generate signed app-update.json
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SETUP="dist/ClashWin_${VERSION}_x64-setup.exe"
          ZIP="dist/ClashWin_${VERSION}_x64_portable.zip"
          for f in "$SETUP" "$ZIP" "dist/SHA256SUMS.txt"; do
            [ -s "$f" ] || { echo "::error::missing/empty asset: $f"; exit 1; }
          done

          SHA="$(sha256sum "$SETUP" | awk '{print $1}')"
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/ClashWin_${VERSION}_x64-setup.exe"
          SIG=""
          if [ -n "${MINISIGN_PRIVATE_KEY:-}" ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq minisign) >/dev/null 2>&1
            KEYDIR="$(mktemp -d)"
            trap 'rm -rf "$KEYDIR"' EXIT
            printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$KEYDIR/sec.key"
            chmod 600 "$KEYDIR/sec.key"
            minisign -Sm "$SETUP" -s "$KEYDIR/sec.key" -x "$KEYDIR/setup.sig"
            SIG="$(cat "$KEYDIR/setup.sig")"
          else
            echo "::warning::MINISIGN_PRIVATE_KEY is not configured -> app-update.json will ship without signature."
          fi

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST_OUT="${RUNNER_TEMP}/app-update.generated.json"
          NOTES_OUT="${RUNNER_TEMP}/release_body.md"

          python3 - "$VERSION" "$REPO" "$SHA" "$URL" "$SIG" "$PUB_DATE" "$MANIFEST_OUT" "$NOTES_OUT" <<'PY'
          import base64, json, pathlib, re, sys

          ver, repo, sha, url, sig, pub_date, manifest_out, notes_out = sys.argv[1:9]

          # 若存在可选的 docs/RELEASE_NOTES_<ver>.md 则优先使用，否则直接从 CHANGELOG.md 提取
          opt_notes = pathlib.Path(f"docs/RELEASE_NOTES_{ver}.md")
          cl_txt = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sec = re.search(rf"(?ms)^##\s+v{re.escape(ver)}\b[^\r\n]*\r?\n(.*?)(?=^##\s+v|\Z)", cl_txt)
          changelog_sec = sec.group(1).strip() if sec else f"Clash Win v{ver}"
          body_main = opt_notes.read_text(encoding="utf-8").strip() if opt_notes.is_file() else f"# Clash Win v{ver}\n\n{changelog_sec}"

          auth_status = ""
          sig_status_file = pathlib.Path("dist/SIGNATURE_STATUS.txt")
          if sig_status_file.is_file():
              auth_status = sig_status_file.read_text(encoding="utf-8").split("|")[0].strip()

          if auth_status in ("", "NotSigned"):
              sign_note = (
                  f"> v{ver} 产物**未附带公网 Authenticode 商业签名**（签名状态只记录、不阻断发布）。\n"
                  f"> Windows 首次运行会提示「未知发布者」/ SmartScreen 警告；请在运行前用 `SHA256SUMS.txt` 校验哈希。"
              )
          else:
              sign_note = (
                  f"> v{ver} 产物 Authenticode 状态：`{auth_status}`。\n"
                  f"> 请在运行前用 `SHA256SUMS.txt` 校验哈希。"
              )

          full_notes = (
              f"{body_main}\n\n---\n\n"
              f"## 下载地址 / Downloads\n\n"
              f"- [Windows x64 安装版 (`ClashWin_{ver}_x64-setup.exe`)](https://github.com/{repo}/releases/download/v{ver}/ClashWin_{ver}_x64-setup.exe)\n"
              f"- [Windows x64 便携版 (`ClashWin_{ver}_x64_portable.zip`)](https://github.com/{repo}/releases/download/v{ver}/ClashWin_{ver}_x64_portable.zip)\n\n"
              f"## 校验与已知限制 / Checksums & Known Limitations\n\n"
              f"随本 Release 提供 `SHA256SUMS.txt`。\n\n"
              f"{sign_note}\n"
              f"> 完整说明见 [docs/KNOWN_LIMITATIONS.md](https://github.com/{repo}/blob/main/docs/KNOWN_LIMITATIONS.md)。\n"
          )
          pathlib.Path(notes_out).write_text(full_notes, encoding="utf-8")

          platform = {"url": url, "sha256": sha}
          if sig:
              platform["signature"] = base64.b64encode(sig.encode("utf-8")).decode("ascii")
          manifest = {
              "version": ver,
              "notes": changelog_sec,
              "pub_date": pub_date,
              "platforms": {"windows-x86_64": platform},
          }
          manifest_json = json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          pathlib.Path(manifest_out).write_text(manifest_json, encoding="utf-8")
          pathlib.Path("dist/app-update.json").write_text(manifest_json, encoding="utf-8")
          print("OK: assembled release notes and generated app-update.json.")
          PY

      - name: Create / update GitHub Release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Clash Win Ver.${VERSION}"
          NOTES_FILE="${RUNNER_TEMP}/release_body.md"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TITLE" --notes-file "$NOTES_FILE" --verify-tag
          fi
          echo "Published: https://github.com/${REPO}/releases/tag/${TAG}"

      - name: Sync updater/app-update.json to main (and fast-forward dev if aligned)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/dev:refs/remotes/origin/dev"
          git checkout -f -B main "origin/main"
          cp "${RUNNER_TEMP}/app-update.generated.json" updater/app-update.json
          git add updater/app-update.json
          if git diff --cached --quiet; then
            echo "Manifest on main already matches v${VERSION}; nothing to push."
          else
            git commit -m "chore(updater): refresh app-update.json for v${VERSION} [skip ci]"
            git push origin main
            # 若 origin/dev 是当前 HEAD 的祖先（常规发版时恒成立），同步快进 origin/dev，彻底消除 main/dev 分叉！
            if git merge-base --is-ancestor "origin/dev" HEAD; then
              git push origin HEAD:dev || echo "::notice::Could not fast-forward dev; release.ps1 will sync on next release."
            fi
            echo "Manifest synced for v${VERSION}."
          fi
