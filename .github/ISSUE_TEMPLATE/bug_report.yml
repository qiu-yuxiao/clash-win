name: 问题反馈 / Bug report
title: '[BUG] '
description: 反馈你遇到的问题 / Report the issue you are experiencing
labels: ['bug']
type: 'Bug'

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：

        1. 请 **确保** 已查阅 [Clash Win Wiki](https://github.com/qiu-yuxiao/clash-win/wiki) 与 [常见问题](https://github.com/qiu-yuxiao/clash-win/wiki/FAQ)
        2. 请 **确保** [已有的问题](https://github.com/qiu-yuxiao/clash-win/issues?q=is%3Aissue) 中没有人提交过相似 issue，否则请在已有的 issue 下讨论
        3. 请 **务必** 先查看 [已知限制](https://github.com/qiu-yuxiao/clash-win/blob/main/docs/KNOWN_LIMITATIONS_0.2.4.md)，确认不是已登记的已知限制
        4. 请 **务必** 给 issue 填写一个简洁明了的标题，以便他人快速检索
        5. 请 **务必** 使用 [最新 Release](https://github.com/qiu-yuxiao/clash-win/releases/latest) 复现后再提交

        ## Before submitting the issue:

        1. Please read the [Clash Win Wiki](https://github.com/qiu-yuxiao/clash-win/wiki) and [FAQ](https://github.com/qiu-yuxiao/clash-win/wiki/FAQ)
        2. Please check the [existing issues](https://github.com/qiu-yuxiao/clash-win/issues?q=is%3Aissue) for duplicates
        3. Please check the [Known Limitations](https://github.com/qiu-yuxiao/clash-win/blob/main/docs/KNOWN_LIMITATIONS_0.2.4.md) first
        4. Please use a concise, searchable title
        5. Please reproduce on the [latest release](https://github.com/qiu-yuxiao/clash-win/releases/latest) before filing

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并配合截图 / Describe the problem in detail with screenshots
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本 / Clash Win Version
      description: 请提供完整版本号（如 0.2.4）及使用形态：安装版 / 便携版 / Please provide the version (e.g. 0.2.4) and form: setup.exe / portable zip
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供复现问题的步骤 / Steps to reproduce the behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么 / What you expected to happen
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 操作系统版本 / OS Version
      description: Clash Win 仅支持 Windows x64，请提供 Windows 版本与内部版本号（如 Windows 11 23H2 22631） / Windows x64 only; please give edition and build number
      placeholder: 'Windows 11 23H2 (22631)'
    validations:
      required: true

  - type: checkboxes
    id: environment
    attributes:
      label: 运行环境 / Environment
      options:
        - label: 同机安装过 Clash Mini / Clash Verge（v0.2.1 起两者互斥，会互相接管服务） / Clash Mini or Clash Verge also installed (mutually exclusive since v0.2.1)
        - label: 已启用 TUN 模式 / TUN mode enabled
        - label: 已启用系统代理 / System proxy enabled
        - label: 便携版（解压即用） / Portable zip
        - label: 安装版（NSIS setup.exe） / NSIS installer
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志（请勿上传日志文件，直接粘贴内容）/ Log (paste text, do not attach the file)
      description: 请在「设置 → 日志等级」调整为 debug 后重启程序，粘贴相关日志片段 / Set log level to debug in Settings, restart, then paste the relevant lines
      render: log
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已阅读已知限制，确认这不是已登记项 / I have read the Known Limitations
          required: true
        - label: 我已用最新 Release 复现 / I reproduced on the latest release
          required: true
