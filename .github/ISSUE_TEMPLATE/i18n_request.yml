name: I18N / 多语言相关
title: '[I18N] '
description: 用于多语言翻译、国际化相关问题或建议 / For translation and internationalization issues
labels: ['I18n']
type: 'Task'

body:
  - type: markdown
    attributes:
      value: |
        ## I18N 相关问题/建议
        请用此模板提交翻译错误、缺失、建议或新增语言请求。
        Clash Win 的语言资源位于 `locales/<lang>/*.json`，安装器支持简体中文 / English / Русский 三语起始语言。
        Please use this template for translation errors, missing translations, suggestions, or new language requests.
        Language resources live in `locales/<lang>/*.json`.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 详细描述你的 I18N 问题或建议 / Please describe your I18N issue or suggestion in detail
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: 相关语言 / Language
      description: 例如 zh, en, ru, ... / e.g. zh, en, ru, ...
    validations:
      required: true

  - type: input
    id: key
    attributes:
      label: 相关键名 / Translation key
      description: 若已知，请给出 locales 中的键名（如 layout.components.dialogs.client.changelogEmpty）/ The translation key, if known
    validations:
      required: false

  - type: textarea
    id: suggestion
    attributes:
      label: 建议或修正内容 / Suggestion or Correction
      description: 请填写建议的译文 / Please provide the suggested translation
    validations:
      required: false

  - type: checkboxes
    id: i18n-type
    attributes:
      label: 问题类型 / Issue Type
      options:
        - label: 翻译错误 / Translation error
        - label: 翻译缺失 / Missing translation
        - label: 建议优化 / Suggestion
        - label: 新增语言 / New language
        - label: 界面文字截断 / 排版溢出 / Text clipping or layout overflow
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本 / Clash Win Version
      description: 请提供你使用的具体版本 / Please provide the Clash Win version you are using
    validations:
      required: true
